name: Mirror Dustloop

# Mirrors selected games from the Dustloop wiki (see SECTIONS in
# dustloop_mirror.py): GGST first, then Granblue Fantasy Versus: Rising, then
# Marvel Tokon. Each game is stored separately as split tar files on the
# "mirror-data" release, which has no size cap (the Actions cache tops out
# at 10 GB). Your codespace downloads them with .devcontainer/refresh.sh.
#
# Triggers:
#   - Scheduled: 07:00 UTC daily, starting with GGST; each game hands off to
#     the next once it has nothing left to do
#   - Push:      a short GGST run whenever the script or this file changes
#   - Manual:    "Run workflow" on the Actions tab (pick a game + time budget)
# While a game still has pages or videos left, each run queues another run
# of the same game; when it's done, it queues the next game.

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
    paths:
      - dustloop_mirror.py
      - .github/workflows/mirror.yml
  workflow_dispatch:
    inputs:
      section:
        description: Which game (ggst, gbvsr, tokon)
        default: ggst
      budget_minutes:
        description: Stop starting new pages after this many minutes
        default: '60'

permissions:
  contents: write   # upload the mirror to the release
  actions: write    # queue the next run

concurrency:
  group: dustloop-mirror
  # A newer run replaces one in progress; the save step still runs on
  # cancel (if: always()), so progress isn't lost.
  cancel-in-progress: true

env:
  SECTION: ${{ inputs.section || 'ggst' }}
  RELEASE_TAG: mirror-data
  GH_TOKEN: ${{ github.token }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp (combo videos)
        run: pip install -U yt-dlp && yt-dlp --version

      # Optional: YouTube sometimes asks GitHub's machines to "sign in to
      # confirm you're not a bot". A Netscape-format cookies.txt saved as the
      # YOUTUBE_COOKIES repo secret lets yt-dlp get past that. It is written
      # outside the mirror folder, so it's never uploaded with the mirror.
      - name: Load YouTube cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            f="$RUNNER_TEMP/yt-cookies.txt"
            umask 077
            printf '%s\n' "$YT_COOKIES" > "$f"
            echo "DUSTLOOP_YT_COOKIES=$f" >> "$GITHUB_ENV"
            echo "YouTube cookies loaded ($(grep -c . "$f") lines)."
          else
            echo "No YOUTUBE_COOKIES secret; combo videos download without cookies."
          fi

      - name: Make sure the storage release exists
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Mirror data" \
              --notes "Mirror files, one set of tar parts per game. Updated automatically; download with .devcontainer/refresh.sh."

      - name: Restore this game's mirror from the release
        id: restore
        run: |
          mkdir -p /tmp/parts
          if gh release download "$RELEASE_TAG" --pattern "mirror-$SECTION.tar.part*" --dir /tmp/parts 2>/dev/null \
             && ls /tmp/parts/mirror-$SECTION.tar.part* >/dev/null 2>&1; then
            cat /tmp/parts/mirror-$SECTION.tar.part* | tar -x -C ~
            rm -rf /tmp/parts
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Restored $SECTION:"; du -sh ~/dustloop_mirror
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No saved mirror for $SECTION yet."
          fi

      # One-time migration: GGST used to live in the Actions cache.
      - name: Restore GGST from the old cache (first run only)
        if: steps.restore.outputs.found != 'true' && env.SECTION == 'ggst'
        uses: actions/cache/restore@v4
        with:
          path: ~/dustloop_mirror
          key: dustloop-mirror-none
          restore-keys: |
            dustloop-mirror-

      - name: Run the mirror script
        id: mirror
        env:
          BUDGET: ${{ github.event_name == 'push' && '5' || github.event_name == 'schedule' && '290' || inputs.budget_minutes || '60' }}
        run: |
          set +e
          timeout 18000 python dustloop_mirror.py --section "$SECTION" --budget-minutes "$BUDGET"
          echo "Mirror script exited with code $?"
          exit 0

      - name: Remove YouTube cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/yt-cookies.txt"

      - name: Show what was downloaded
        if: always()
        run: |
          du -sh ~/dustloop_mirror 2>/dev/null || echo "(no mirror dir)"
          find ~/dustloop_mirror -type f 2>/dev/null | wc -l | xargs echo "Files:"

      # Release assets are capped at 2 GB each, so the tar is split into parts.
      - name: Save this game's mirror to the release
        if: always()
        run: |
          [ -d ~/dustloop_mirror ] || { echo "Nothing to save."; exit 0; }
          mkdir -p /tmp/out && cd /tmp/out && rm -f mirror-$SECTION.tar.part*
          tar -C ~ -cf - dustloop_mirror | split -b 1900m -d -a 2 - "mirror-$SECTION.tar.part"
          ls -lh
          gh release upload "$RELEASE_TAG" mirror-$SECTION.tar.part* --clobber -R "$GITHUB_REPOSITORY"
          # Remove leftover parts from an earlier, larger upload.
          for old in $(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep "^mirror-$SECTION.tar.part"); do
            [ -f "$old" ] || gh release delete-asset "$RELEASE_TAG" "$old" -y -R "$GITHUB_REPOSITORY"
          done

      - name: Queue the next run
        if: steps.mirror.outputs.next_section != ''
        run: |
          echo "Next: ${{ steps.mirror.outputs.next_section }}"
          gh workflow run mirror.yml --ref main -f section=${{ steps.mirror.outputs.next_section }} -f budget_minutes=60

name: Mirror Dustloop GGST Wiki

# Runs daily and uploads the mirror as a downloadable artifact.
# Triggers:
#   - Scheduled: 07:00 UTC every day (only re-downloads changed pages)
#   - Push:      a short run whenever the mirror script or this file changes
#   - Manual:    "Run workflow" button on the Actions tab
# While pages are still left to download, each run queues the next one,
# so the mirror fills in chunk by chunk and every chunk is downloadable.

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
    paths:
      - dustloop_mirror.py
      - .github/workflows/mirror.yml
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Stop starting new pages after this many minutes
        default: '60'

permissions:
  contents: read
  actions: write   # lets a run queue the next chunk

concurrency:
  group: dustloop-mirror
  # A newer run replaces one in progress; progress is saved either way
  # (the cache save step runs even on cancel).
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    # GitHub free-tier hard cap is 6 hours per job; 350 minutes leaves headroom.
    # The bootstrap (first full mirror) may need 1-3 runs of this length.
    # Daily incremental runs after bootstrap finish in minutes.
    timeout-minutes: 350

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp (combo videos)
        run: pip install -U yt-dlp && yt-dlp --version

      # Cache is split into restore + save so we can save UNCONDITIONALLY.
      # The default actions/cache@v4 only saves on success — useless here,
      # because long bootstrap runs can hit the timeout, and we'd lose progress.
      - name: Restore previous mirror from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/dustloop_mirror
          key: dustloop-mirror-${{ github.run_id }}
          restore-keys: |
            dustloop-mirror-

      - name: Show what we restored from cache (if anything)
        run: |
          if [ -d ~/dustloop_mirror ]; then
            echo "Cache hit — resuming from previous mirror state:"
            du -sh ~/dustloop_mirror
            find ~/dustloop_mirror/site -type f 2>/dev/null | wc -l | xargs echo "Files in mirror:"
          else
            echo "No cache — starting fresh."
          fi

      # The script stops starting new pages once its budget is used up and
      # saves progress after every page, so nothing is lost. `timeout` is
      # only a safety net. We never fail the job, so the cache always saves.
      - name: Run the mirror script
        id: mirror
        env:
          BUDGET: ${{ github.event_name == 'push' && '5' || github.event_name == 'schedule' && '290' || inputs.budget_minutes || '60' }}
        run: |
          set +e
          timeout 18000 python dustloop_mirror.py --budget-minutes "$BUDGET"
          echo "Mirror script exited with code $?"
          exit 0

      - name: Show what was downloaded
        if: always()
        run: |
          echo "Mirror size:"
          du -sh ~/dustloop_mirror 2>/dev/null || echo "(no mirror dir)"
          echo "Files in mirror:"
          find ~/dustloop_mirror -type f 2>/dev/null | wc -l
          echo "Top-level layout:"
          ls -la ~/dustloop_mirror 2>/dev/null || true

      # Save cache UNCONDITIONALLY (note `if: always()`). This is the critical
      # difference from the previous workflow — even on timeout, partial
      # progress is preserved for the next run.
      - name: Save mirror to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/dustloop_mirror
          key: dustloop-mirror-${{ github.run_id }}

      - name: Compress the mirror
        if: always()
        run: |
          if [ -d ~/dustloop_mirror ]; then
            cd ~
            tar -czf dustloop_mirror.tar.gz dustloop_mirror
            ls -lh dustloop_mirror.tar.gz
          else
            echo "No mirror to compress."
            exit 1
          fi

      - name: Upload as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dustloop-mirror
          path: ~/dustloop_mirror.tar.gz
          retention-days: 30
          if-no-files-found: warn

      # Keep going in chunks until every page has been attempted once.
      - name: Queue the next chunk
        # Pages left and progress made, or videos left and progress made.
        if: >-
          (steps.mirror.outputs.remaining != '' && steps.mirror.outputs.remaining != '0' && steps.mirror.outputs.fetched != '0') ||
          (steps.mirror.outputs.videos_remaining != '' && steps.mirror.outputs.videos_remaining != '0' && steps.mirror.outputs.videos_downloaded != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.mirror.outputs.remaining }} pages and ${{ steps.mirror.outputs.videos_remaining }} videos left; queueing another run."
          gh workflow run mirror.yml --ref main -f budget_minutes=60
